name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]" ruff
      - name: Lint (syntax errors and pyflakes)
        run: ruff check src tests --select E9,F
      - name: Tests with coverage
        run: pytest --cov=lep --cov-report=term-missing
      - name: CLI smoke
        run: |
          lep policy > /dev/null
          lep demo > /dev/null
